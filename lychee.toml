# Link check for the built site: `lychee --root-dir "$PWD/dist" dist`.
# Email links are not probed (offline-safe); external links are retried.
max_retries = 3
retry_wait_time = 5
timeout = 20
accept = ["200..=299", "429"]
include_mail = false
include_fragments = "full"
# LinkedIn answers bots with 999 / auth walls; the URL is still checked by check:facts.
exclude = ["^https?://(www\\.)?linkedin\\.com/"]
