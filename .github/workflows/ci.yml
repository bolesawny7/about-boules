name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Page size (< 150 KB)
        run: |
          size=$(wc -c < dist/index.html)
          echo "dist/index.html: $size bytes"
          test "$size" -lt 153600

      - name: Validate HTML
        run: npm run validate:html

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist --no-progress dist
          fail: true

      - name: Check facts
        run: npm run check:facts

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
